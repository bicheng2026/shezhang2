name: 同步班群摘要与公告（从蛇杖一号）

# 二号只读一号的公开数据文件，一号完全无感。
# 二号失败 = 本 workflow 报错，一号不受任何影响。
on:
  schedule:
    - cron: "*/30 * * * *"      # 每 30 分钟（GitHub 可能延迟几分钟，属正常）
  workflow_dispatch:            # 也支持手动点一次

permissions:
  contents: write

concurrency:
  group: sync-qq
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从蛇杖一号拉取并合并
        run: python3 .github/scripts/sync_qq.py

      - name: 有变化才提交
        run: |
          if [ -n "$(git status --porcelain data/qq_digest.json data/todo.json)" ]; then
            git config user.name  "bicheng2026"
            git config user.email "bicheng2026@163.com"
            git add data/qq_digest.json data/todo.json
            git commit -m "sync: 同步班群摘要与公告 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "已提交并推送"
          else
            echo "无变化，跳过提交"
          fi
